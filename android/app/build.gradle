plugins {
    id 'com.android.application'
}

def appVersion = new groovy.json.JsonSlurper().parseText(file('../../package.json').text).version
def stableKeystore = file('dongfen-release.keystore')
def stablePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def stableAlias = System.getenv('ANDROID_KEY_ALIAS') ?: 'dongfen'
def hasStableSigning = stableKeystore.exists() && stablePassword

android {
    namespace 'com.wangyin.dongfen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.wangyin.dongfen'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName appVersion
    }

    signingConfigs {
        if (hasStableSigning) {
            stable {
                storeFile stableKeystore
                storePassword stablePassword
                keyAlias stableAlias
                keyPassword stablePassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (hasStableSigning) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}